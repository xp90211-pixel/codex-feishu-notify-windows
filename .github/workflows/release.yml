name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Unsupported release tag: $env:GITHUB_REF_NAME"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run project tests
        shell: pwsh
        run: ./tests/Test-Project.ps1

      - name: Reliability on PowerShell 7
        shell: pwsh
        run: ./tests/Test-Reliability.ps1

      - name: No-console host on PowerShell 7
        shell: pwsh
        run: ./tests/Test-NotificationHost.ps1

      - name: No-console host on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-NotificationHost.ps1

      - name: Reliability on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-Reliability.ps1

      - name: Install transactions on PowerShell 7
        shell: pwsh
        run: ./tests/Test-InstallTransaction.ps1

      - name: Install transactions on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-InstallTransaction.ps1

      - name: Task Scheduler manual controls
        shell: pwsh
        run: ./tests/Test-ManualTaskControl.ps1

      - name: Build and smoke-test installer
        shell: pwsh
        run: ./tests/Test-OneClickInstaller.ps1 -Version 0.0.0-release-ci

      - name: Fresh-only and all-idle notifications on PowerShell 7
        shell: pwsh
        run: |
          ./tests/Test-FreshNotifications.ps1
          ./tests/Test-AllIdleReminder.ps1

      - name: Fresh-only and all-idle notifications on Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/Test-FreshNotifications.ps1
          ./tests/Test-AllIdleReminder.ps1

      - name: Build release assets
        shell: pwsh
        run: ./scripts/New-OneClickInstaller.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = '${{ steps.version.outputs.version }}'
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }
          $releaseTitle = ((Get-Content -LiteralPath $notes -Encoding UTF8 -TotalCount 1) -replace '^#\s*', '')
          $assets = @(
            "dist/codex-feishu-notify-windows-v$version.zip",
            "dist/codex-feishu-notify-windows-v$version.zip.sha256",
            "dist/codex-feishu-notify-windows-v$version-setup.exe",
            "dist/codex-feishu-notify-windows-v$version-setup.exe.sha256"
          )
          $isPrerelease = $version.Contains('-')
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if ($releaseExists) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }
            $prereleaseValue = $isPrerelease.ToString().ToLowerInvariant()
            gh release edit $tag --title $releaseTitle --notes-file $notes "--prerelease=$prereleaseValue" --repo $env:GITHUB_REPOSITORY
          } else {
            $releaseArguments = @('release', 'create', $tag) + $assets + @('--verify-tag', '--title', $releaseTitle, '--notes-file', $notes, '--repo', $env:GITHUB_REPOSITORY)
            if ($isPrerelease) { $releaseArguments += '--prerelease' }
            gh @releaseArguments
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the GitHub Release.' }
