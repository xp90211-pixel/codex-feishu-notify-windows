name: PowerShell checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run project tests on PowerShell 7
        shell: pwsh
        run: ./tests/Test-Project.ps1

      - name: Run project tests on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-Project.ps1

      - name: Reliability on PowerShell 7
        shell: pwsh
        run: ./tests/Test-Reliability.ps1

      - name: No-console host on PowerShell 7
        shell: pwsh
        run: ./tests/Test-NotificationHost.ps1

      - name: No-console host on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-NotificationHost.ps1

      - name: Reliability on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-Reliability.ps1

      - name: Install transactions on PowerShell 7
        shell: pwsh
        run: ./tests/Test-InstallTransaction.ps1

      - name: Install transactions on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-InstallTransaction.ps1

      - name: Task Scheduler manual controls
        shell: pwsh
        run: ./tests/Test-ManualTaskControl.ps1

      - name: Build and smoke-test the one-click installer
        shell: pwsh
        run: ./tests/Test-OneClickInstaller.ps1 -Version 0.0.0-ci
